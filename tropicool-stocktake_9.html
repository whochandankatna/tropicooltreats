<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tropicool Treats - Stocktake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Bodoni+Moda:opsz,wght@6..96,700;6..96,800;6..96,900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --sand:#E7EAF7; --sand-deep:#D9DEF2;
    --teal:#4E6EF2; --teal-deep:#3752D6;
    --mint:#8A8D9E; --coral:#4E6EF2; --coral-deep:#3752D6;
    --grape:#14151C; --grape-deep:#000000;
    --dry:#7C94F5; --dry-deep:#5B76E8;
    --ice:#8A93B8; --ice-deep:#5B6178;
    --sauce:#8A93B8; --sauce-deep:#5B6178;
    --clean:#8A93B8; --clean-deep:#5B6178;
    --frozenfruit:#8A93B8; --frozenfruit-deep:#5B6178;
    --freshfruit:#8A93B8; --freshfruit-deep:#5B6178;
    --premix:#8A93B8; --premix-deep:#5B6178;
    --toppings:#8A93B8; --toppings-deep:#5B6178;
    --packaging:#8A93B8; --packaging-deep:#5B6178;
    --milk:#8A93B8; --milk-deep:#5B6178;
    --juice:#8A93B8; --juice-deep:#5B6178;
    --tiramisu:#8A93B8; --tiramisu-deep:#5B6178;
    --important:#4E6EF2; --important-deep:#3752D6;
    --fridgecol:#8A93B8; --fridgecol-deep:#5B6178;
    --ink:#14151C; --ink-soft:#8A8D9E;
    --line:rgba(20,21,28,0.08); --card:#FFFFFF;

    --btn-bg-1:#1A1B22; --btn-bg-2:#000000; --btn-text:#FFFFFF;
    --btn2-bg:#EEF0F7; --btn2-text:#14151C;

    --hero-grad:linear-gradient(135deg, #3752D6 0%, #4E6EF2 45%, #7C94F5 75%, #A9BAFA 100%);

    --glass-strong:rgba(255,255,255,0.9);
    --glass-mid:rgba(255,255,255,0.8);
    --glass-card:rgba(255,255,255,0.86);
    --glass-soft:rgba(255,255,255,0.65);
    --glass-modal:rgba(255,255,255,0.96);
    --glass-border:rgba(20,21,28,0.07);
    --glass-tab-track:rgba(20,21,28,0.05);
    --glass-tab-hover:rgba(20,21,28,0.08);
    --dot-color:transparent;
    --input-focus-bg:#FFFFFF;
    --tint-soft:rgba(20,21,28,0.045);
    --specular:inset 0 0 0 0 transparent;

    --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px;
    --sp-6:24px; --sp-8:32px; --sp-10:40px; --sp-12:48px;

    --r-sm:10px; --r-md:16px; --r-lg:24px; --r-xl:30px; --r-pill:999px;

    --shadow-sm:0 1px 3px rgba(20,21,28,0.06);
    --shadow-md:0 10px 30px rgba(20,21,28,0.1);
    --shadow-lg:0 26px 64px rgba(20,21,28,0.18);
    --glow-teal:0 0 26px rgba(78,110,242,0.4), 0 0 54px rgba(78,110,242,0.16);
    --glow-coral:0 0 24px rgba(78,110,242,0.4), 0 0 50px rgba(78,110,242,0.16);

    font-family:'Jost',sans-serif;
  }
  html[data-theme="dark"]{
    --sand:#0E0F14; --sand-deep:#16171E;
    --teal:#7C94F5; --teal-deep:#4E6EF2;
    --card:#181A22;
    --ink:#F2F3F8; --ink-soft:#8A8D9E;
    --line:rgba(124,148,245,0.16);
    --btn-bg-1:#F2F3F8; --btn-bg-2:#FFFFFF; --btn-text:#0E0F14;
    --btn2-bg:#22242E; --btn2-text:#F2F3F8;
    --mint:#8A8D9E; --coral:#7C94F5; --coral-deep:#A9BAFA;
    --grape:#F2F3F8; --grape-deep:#FFFFFF;
    --dry:#A9BAFA; --dry-deep:#7C94F5;
    --ice:#9AA2C2; --ice-deep:#C4CBE8;
    --sauce:#9AA2C2; --sauce-deep:#C4CBE8;
    --clean:#9AA2C2; --clean-deep:#C4CBE8;
    --frozenfruit:#9AA2C2; --frozenfruit-deep:#C4CBE8;
    --freshfruit:#9AA2C2; --freshfruit-deep:#C4CBE8;
    --premix:#9AA2C2; --premix-deep:#C4CBE8;
    --toppings:#9AA2C2; --toppings-deep:#C4CBE8;
    --packaging:#9AA2C2; --packaging-deep:#C4CBE8;
    --milk:#9AA2C2; --milk-deep:#C4CBE8;
    --juice:#9AA2C2; --juice-deep:#C4CBE8;
    --tiramisu:#9AA2C2; --tiramisu-deep:#C4CBE8;
    --important:#7C94F5; --important-deep:#A9BAFA;
    --fridgecol:#9AA2C2; --fridgecol-deep:#C4CBE8;
    --glass-strong:rgba(24,26,34,0.86);
    --glass-mid:rgba(24,26,34,0.68);
    --glass-card:rgba(24,26,34,0.76);
    --glass-soft:rgba(18,19,25,0.56);
    --glass-modal:rgba(12,13,17,0.92);
    --glass-border:rgba(124,148,245,0.2);
    --glass-tab-track:rgba(124,148,245,0.07);
    --glass-tab-hover:rgba(124,148,245,0.13);
    --dot-color:transparent;
    --input-focus-bg:#22242E;
    --tint-soft:rgba(124,148,245,0.09);
    --specular:inset 0 0 0 0 transparent;
    --glow-teal:0 0 26px rgba(124,148,245,0.5), 0 0 54px rgba(124,148,245,0.2);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background-color:var(--sand);
    background-image:
      radial-gradient(ellipse 1500px 950px at 50% -18%, rgba(78,110,242,0.14), transparent 60%),
      radial-gradient(ellipse 1100px 750px at 82% -8%, rgba(78,110,242,0.10), transparent 55%);
    background-attachment:fixed;
    transition:background-color .3s ease;
    min-height:100vh; position:relative; overflow-x:hidden;
  }
  html[data-theme="dark"] body{
    background-image:
      radial-gradient(ellipse 1500px 950px at 50% -18%, rgba(124,148,245,0.16), transparent 60%),
      radial-gradient(ellipse 1100px 750px at 82% -8%, rgba(124,148,245,0.10), transparent 55%);
  }

  .stk-app-shell{ display:flex; min-height:100vh; }
  .stk-sidebar{
    display:none; flex-direction:column; align-items:center; gap:var(--sp-2);
    width:92px; flex-shrink:0; padding:var(--sp-5) var(--sp-2); position:sticky; top:0; height:100vh;
    background:var(--glass-strong); backdrop-filter:blur(32px) saturate(180%); -webkit-backdrop-filter:blur(32px) saturate(180%);
    border-right:1px solid var(--glass-border); z-index:30;
  }
  .stk-sidebar-logo{
    width:40px; height:40px; border-radius:var(--r-md); background:linear-gradient(135deg,#000000 0%,var(--teal) 55%,#FFFFFF 100%);
    color:#fff; display:flex; align-items:center; justify-content:center; font-family:'Jost',sans-serif;
    font-weight:500; font-size:14px; margin-bottom:var(--sp-4); box-shadow:var(--specular); flex-shrink:0;
  }
  .stk-sidebar-btn{
    width:100%; padding:var(--sp-2) 4px; border-radius:var(--r-md); border:none; background:transparent;
    color:var(--ink-soft); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; cursor:pointer;
    transition:all .18s ease;
  }
  .stk-sidebar-btn svg{ width:19px; height:19px; flex-shrink:0; }
  .stk-sidebar-btn span{ font-family:'Jost',sans-serif; font-size:10px; font-weight:500; line-height:1.15; text-align:center; }
  .stk-sidebar-btn:hover{ background:var(--glass-tab-hover); color:var(--ink); }
  .stk-sidebar-btn.active{ background:linear-gradient(135deg,#000000 0%,var(--teal) 55%,#FFFFFF 100%); color:#fff; box-shadow:var(--specular); }
  .stk-sidebar-spacer{ flex:1; }
  .stk-main-col{ flex:1; min-width:0; }
  .stk-root{ color:var(--ink); min-height:100vh; padding:var(--sp-6) var(--sp-4) var(--sp-12); max-width:900px; margin:0 auto; position:relative; z-index:1; }
  @media (min-width: 900px){
    .stk-sidebar{ display:flex; }
    .stk-hud .stk-tabs{ display:none; }
    .stk-root{ max-width:1100px; padding:var(--sp-6) var(--sp-8) var(--sp-12); }
  }

  .stk-hud{
    position:sticky; top:10px; z-index:20;
    background:var(--glass-strong);
    backdrop-filter:blur(32px) saturate(180%); -webkit-backdrop-filter:blur(32px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:var(--r-xl);
    padding:var(--sp-4) var(--sp-5) var(--sp-3);
    margin-bottom:var(--sp-5);
    box-shadow:var(--shadow-sm), var(--specular);
    overflow:hidden;
    transition:padding .25s ease;
  }
  .stk-hud.compact{ padding:var(--sp-2) var(--sp-5); }
  .stk-header{ display:flex; align-items:flex-end; justify-content:space-between; gap:var(--sp-3); flex-wrap:wrap; margin-bottom:var(--sp-2); transition:margin .25s ease; }
  .stk-hud.compact .stk-header{ margin-bottom:0; }
  .stk-title{ font-family:'Bodoni Moda',serif; font-weight:900; font-size:26px; color:var(--ink); display:flex; align-items:center; gap:var(--sp-3); letter-spacing:0; transition:font-size .25s ease; }
  .stk-hud.compact .stk-title{ font-size:18px; }
  .stk-sub{ font-size:13px; color:var(--ink-soft); margin-top:2px; letter-spacing:0.1px; max-height:20px; opacity:1; overflow:hidden; transition:max-height .25s ease, opacity .2s ease, margin .25s ease; }
  .stk-hud.compact .stk-sub{ max-height:0; opacity:0; margin-top:0; }
  .stk-theme-toggle{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--glass-border);
    background:var(--glass-soft); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; color:var(--ink-soft); transition:all .2s ease; flex-shrink:0; padding:0;
  }
  .stk-theme-toggle:hover{ color:var(--ink); background:var(--glass-tab-hover); }
  .stk-theme-toggle.active{ background:rgba(78,110,242,0.14); color:var(--teal-deep); border-color:var(--teal); }
  .stk-theme-toggle svg{ width:17px; height:17px; }

  .stk-status-strip{
    display:flex; align-items:center; gap:var(--sp-4); flex-wrap:wrap;
    padding:var(--sp-3) var(--sp-4); margin-bottom:var(--sp-3); border-radius:var(--r-lg);
    background:var(--tint-soft); border:1px solid var(--line); transition:transform .25s ease, opacity .25s ease, margin .25s ease, padding .25s ease;
  }
  .stk-hud.compact .stk-status-strip{ max-height:0; opacity:0; margin:0; padding:0; overflow:hidden; border:none; }
  .stk-sync{ font-size:11.5px; padding:6px 12px; border-radius:var(--r-pill); font-weight:500; letter-spacing:0.1px; background:var(--card); color:var(--ink-soft); flex-shrink:0; box-shadow:var(--shadow-sm); }
  .stk-sync.live{ color:var(--ink); }
  .stk-sync.live::before{ content:''; display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--teal); margin-right:7px; vertical-align:middle; animation:syncPulse 1.6s ease-in-out infinite; box-shadow:0 0 0 0 rgba(78,110,242,0.5); }
  @keyframes syncPulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(78,110,242,0.5);} 50%{ box-shadow:0 0 0 5px rgba(78,110,242,0);} }
  .stk-sync.offline{ color:var(--coral-deep); }
  .stk-sync.loading{ color:var(--ink-soft); }
  .stk-health-block{ flex:1; min-width:180px; display:flex; align-items:center; gap:var(--sp-3); }
  .stk-working-now{ display:flex; align-items:center; gap:var(--sp-2); flex-shrink:0; flex-wrap:wrap; }
  .stk-working-now-label{ font-size:11px; font-weight:500; color:var(--ink-soft); white-space:nowrap; }
  .stk-working-now-avatars{ display:flex; flex-wrap:wrap; gap:6px; }
  .stk-working-name-pill{
    font-size:11.5px; font-weight:500; color:#fff; background:linear-gradient(135deg,var(--teal),var(--teal-deep));
    padding:4px 11px; border-radius:var(--r-pill); white-space:nowrap; flex-shrink:0;
  }
  .stk-working-avatar{
    width:26px; height:26px; border-radius:50%; background:linear-gradient(135deg,var(--teal),var(--teal-deep));
    color:#fff; font-size:10.5px; font-weight:600; display:flex; align-items:center; justify-content:center;
    margin-left:-8px; border:2px solid var(--card); flex-shrink:0;
  }
  .stk-working-avatar:first-child{ margin-left:0; }
  .stk-health-label{ font-size:12.5px; font-weight:500; white-space:nowrap; letter-spacing:0.1px; transition:color .3s ease; color:var(--ink); flex-shrink:0; }
  .stk-health-label.critical{ color:#DC2626; }
  .stk-health-label.ok{ color:#16A34A; }
  .stk-health-label.great{ color:var(--teal-deep); }
  .stk-health-bar{ flex:1; height:6px; border-radius:var(--r-pill); background:var(--glass-tab-track); overflow:hidden; }
  .stk-health-fill{ height:100%; border-radius:var(--r-pill); transition:width .5s ease, background .3s ease; }
  .stk-health-fill.critical{ background:#EF4444; }
  .stk-health-fill.ok{ background:#22C55E; }
  .stk-health-fill.great{ background:linear-gradient(90deg,var(--teal),var(--teal-deep)); }
  .stk-meta-line{ font-size:12px; color:var(--ink-soft); margin-bottom:var(--sp-3); max-height:20px; opacity:1; overflow:hidden; transition:max-height .25s ease, opacity .2s ease, margin .25s ease; }
  .stk-hud.compact .stk-meta-line{ max-height:0; opacity:0; margin-bottom:0; }
  .stk-meta-line b{ color:var(--ink); }
  .stk-tabs{ display:flex; gap:var(--sp-1); background:var(--glass-tab-track); padding:var(--sp-1); border-radius:var(--r-lg); width:fit-content; max-width:100%; overflow-x:auto; border:1px solid var(--glass-border); transition:transform .25s ease; }
  .stk-hud.compact .stk-tabs{ transform:scale(0.94); transform-origin:left center; }
  .stk-tab{ font-family:'Jost',sans-serif; font-weight:600; font-size:12.5px; padding:var(--sp-2) var(--sp-3); border-radius:var(--r-md); border:none; background:transparent; color:var(--ink-soft); cursor:pointer; white-space:nowrap; transition:all .2s ease; display:flex; flex-direction:column; align-items:center; gap:4px; }
  .stk-tab svg{ width:17px; height:17px; }
  .stk-tab span{ line-height:1.2; }

  /* Mobile layout: stack header, full-width tabs and health bar. Tablet/desktop keep the side-by-side layout above. */
  @media (max-width: 640px){
    .stk-hud{ padding:var(--sp-4) var(--sp-4) var(--sp-3); }
    .stk-header{ flex-direction:row; align-items:flex-start; justify-content:space-between; gap:var(--sp-3); margin-bottom:var(--sp-3); }
    .stk-title{ font-size:23px; }
    .stk-status-strip{ flex-direction:column; align-items:stretch; }
    .stk-health-block{ min-width:0; }
    .stk-tabs{ width:100%; overflow-x:visible; padding:6px; }
    .stk-tab{ flex:1; padding:var(--sp-3) 2px; font-size:11px; white-space:nowrap; gap:6px; }
    .stk-tab svg{ width:22px; height:22px; }
  }
  .stk-tab.active{ background:linear-gradient(135deg, var(--btn-bg-1), var(--btn-bg-2)); color:var(--btn-text); box-shadow:var(--shadow-sm), var(--specular); font-weight:500; }
  .stk-tab:hover:not(.active){ color:var(--teal-deep); background:var(--glass-tab-hover); }
  .stk-tab:focus-visible, .stk-btn:focus-visible, .stk-input:focus-visible, .stk-cat-tile:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .stk-banner{ display:flex; align-items:center; gap:var(--sp-3); background:var(--glass-card); backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); color:var(--mint); border:1.5px solid var(--mint); padding:var(--sp-4) var(--sp-5); border-radius:var(--r-lg); margin-bottom:var(--sp-3); box-shadow:0 0 22px rgba(251,241,255,0.15), var(--specular); }
  .stk-banner.alert{ color:var(--coral); border-color:var(--coral); box-shadow:0 0 22px rgba(78,110,242,0.3), var(--specular); }
  .stk-banner.over{ color:var(--grape); border-color:var(--grape); box-shadow:0 0 22px rgba(20,21,28,0.3), var(--specular); }
  .stk-banner.expiring{ color:var(--dry); border-color:var(--dry); box-shadow:0 0 22px rgba(124,148,245,0.3), var(--specular); }
  .stk-banner-text{ color:var(--ink); }

  .stk-progress-panel{ background:var(--hero-grad); border:1px solid rgba(255,255,255,0.16); border-radius:var(--r-xl); padding:var(--sp-5) var(--sp-5); margin-bottom:var(--sp-4); box-shadow:0 20px 44px rgba(55,82,214,0.3); position:relative; overflow:hidden; }
  .stk-progress-stat{ display:flex; align-items:baseline; gap:var(--sp-4); margin-bottom:var(--sp-3); }
  .stk-progress-num{ font-family:'Jost',sans-serif; font-weight:500; font-size:42px; color:#fff; letter-spacing:-1px; line-height:1; }
  .stk-progress-num-of{ font-size:18px; color:rgba(255,255,255,0.65); font-weight:400; letter-spacing:0; }
  .stk-progress-meta{ display:flex; flex-direction:column; gap:2px; }
  .stk-progress-label{ font-size:13px; font-weight:600; color:#fff; }
  .stk-progress-sub{ font-size:12px; color:rgba(255,255,255,0.7); }
  .stk-progress-bar{ height:8px; border-radius:var(--r-pill); background:rgba(20,21,28,0.14); overflow:hidden; box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25); }
  .stk-progress-fill{ height:100%; border-radius:var(--r-pill); background:#fff; transition:width .4s ease; box-shadow:0 0 0 1px rgba(20,21,28,0.3), 0 0 10px rgba(255,255,255,0.5); }

  .stk-alerts-strip{
    display:flex; gap:var(--sp-3); overflow-x:auto; overflow-y:hidden;
    padding:var(--sp-1) 2px var(--sp-4); margin-bottom:var(--sp-1);
    scrollbar-width:thin; -webkit-overflow-scrolling:touch;
  }
  .stk-alert-chip{
    display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);
    flex:1 1 150px; min-width:150px; cursor:pointer; border-radius:var(--r-lg);
    padding:var(--sp-4) var(--sp-5); font-family:'Jost',sans-serif;
    background:var(--card); border:1px solid var(--glass-border); transition:all .2s ease; position:relative;
    box-shadow:var(--shadow-sm);
  }
  .stk-alert-chip:hover, .stk-alert-chip:active{ transform:translateY(-3px); box-shadow:var(--shadow-md); }
  .stk-alert-chip.alert:hover{ border-color:var(--coral); }
  .stk-alert-chip.expiring:hover{ border-color:var(--dry); }
  .stk-alert-chip.over:hover{ border-color:var(--grape); }
  .stk-alert-chip-text{ display:flex; flex-direction:column; gap:3px; }
  .stk-alert-chip-count{ font-family:'Jost',sans-serif; font-weight:500; font-size:26px; line-height:1; }
  .stk-alert-chip.alert .stk-alert-chip-count{ color:var(--coral); }
  .stk-alert-chip.expiring .stk-alert-chip-count{ color:var(--dry); }
  .stk-alert-chip.over .stk-alert-chip-count{ color:var(--grape); }
  .stk-alert-chip-label{ font-family:'Jost',sans-serif; font-size:10px; letter-spacing:0.6px; text-transform:uppercase; color:var(--ink-soft); }
  .stk-alert-chip-icon{ width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:rgba(20,21,28,0.05); }
  .stk-alert-chip-icon svg{ width:16px; height:16px; }
  .stk-alert-chip.alert .stk-alert-chip-icon{ color:var(--coral); }
  .stk-alert-chip.expiring .stk-alert-chip-icon{ color:var(--dry); }
  .stk-alert-chip.over .stk-alert-chip-icon{ color:var(--grape); }

  .stk-list-rows{ display:flex; flex-direction:column; gap:var(--sp-2); max-height:52vh; overflow-y:auto; margin-top:var(--sp-2); }
  .stk-list-row{
    display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);
    padding:var(--sp-3); border-radius:var(--r-md); background:var(--tint-soft);
    cursor:pointer; transition:all .15s ease; border:1px solid var(--line);
  }
  .stk-list-row:hover{ background:var(--glass-tab-hover); border-color:var(--teal); }
  .stk-list-row-name{ font-weight:600; font-size:14px; color:var(--ink); }
  .stk-list-row-sub{ font-size:11px; color:var(--ink-soft); font-family:'Jost',sans-serif; margin-top:2px; }

  .stk-diag-panel{ margin-top:var(--sp-4); margin-bottom:var(--sp-4); }
  .stk-diag-header{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:var(--sp-4); padding-bottom:var(--sp-3); border-bottom:1px solid var(--line); }
  .stk-diag-title{ font-family:'Jost',sans-serif; font-weight:600; font-size:15px; color:var(--ink); }
  .stk-diag-sub{ font-family:'Jost',sans-serif; font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; }

function renderUsageBarChart(data){
  if(!data || !data.length) return `<div class="stk-empty">No usage logged yet.</div>`;
  const max = Math.max(...data.map(d=>d.total), 1);
  let peakIdx = 0;
  data.forEach((d,i)=>{ if(d.total > data[peakIdx].total) peakIdx = i; });
  const bars = data.map((d,i)=>{
    const pct = Math.max(4, Math.round((d.total/max)*100));
    const isPeak = i===peakIdx && d.total>0;
    return `<div class="stk-usagechart-col">
      <div class="stk-usagechart-tooltip ${isPeak?'always':''}">${d.total}</div>
      <div class="stk-usagechart-bar-track">
        <div class="stk-usagechart-bar ${isPeak?'peak':''}" style="--bar-h:${pct}%"></div>
      </div>
      <div class="stk-usagechart-label">${d.label}</div>
    </div>`;
  }).join('');
  return `<div class="stk-usagechart">${bars}</div>`;
}
function renderUsageLineChart(data, width, height){
  if(!data || !data.length) return '';
  const max = Math.max(...data.map(d=>d.total), 1);
  const stepX = width / ((data.length - 1) || 1);
  const points = data.map((d,i)=>{
    const x = i * stepX;
    const y = height - (d.total / max) * (height - 20) - 10;
    return {x, y, label:d.label, total:d.total};
  });
  let pathD = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
  for(let i=1;i<points.length;i++){
    const prev = points[i-1], curr = points[i];
    const midX = (prev.x+curr.x)/2, midY = (prev.y+curr.y)/2;
    pathD += ` Q ${prev.x.toFixed(1)} ${prev.y.toFixed(1)} ${midX.toFixed(1)} ${midY.toFixed(1)}`;
  }
  pathD += ` L ${points[points.length-1].x.toFixed(1)} ${points[points.length-1].y.toFixed(1)}`;
  const areaD = pathD + ` L ${points[points.length-1].x.toFixed(1)} ${height} L 0 ${height} Z`;
  const dots = points.map((p,i)=>{
    const isLast = i===points.length-1;
    return `<g class="stk-linechart-point">
      <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="10" fill="transparent"/>
      <circle class="stk-linechart-dot" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast?4:2.5}" fill="#fff" opacity="${isLast?1:0.65}"/>
      <title>${esc(p.label)}: ${p.total} used</title>
    </g>`;
  }).join('');
  return `<svg class="stk-linechart" viewBox="0 0 ${width} ${height}" preserveAspectRatio="none">
    <path d="${areaD}" fill="rgba(255,255,255,0.14)" stroke="none"/>
    <path d="${pathD}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
  </svg>`;
}

function timeAgo(dateStr){
  const diffMs = Date.now() - new Date(dateStr).getTime();
  const mins = Math.round(diffMs/60000);
  if(mins < 1) return 'just now';
  if(mins < 60) return mins+'m ago';
  const hrs = Math.round(mins/60);
  if(hrs < 24) return hrs+'h ago';
  const days = Math.round(hrs/24);
  if(days < 7) return days+'d ago';
  return new Date(dateStr).toLocaleDateString(undefined,{day:'numeric',month:'short'});
}

async function loadStaffPeanuts(){
  const [staffRes, entriesRes] = await Promise.all([
    db.from('tt_staff').select('name').eq('active', true),
    db.from('tt_entries').select('staff_name, entry_date').not('staff_name','is',null)
  ]);
  if(staffRes.error){ console.error(staffRes.error); return []; }
  const staffNames = (staffRes.data||[]).map(s=>s.name);
  if(!staffNames.length) return [];

  // Match entries to canonical staff names case-insensitively, so old
  // typo'd variants ("soph", "Sophie ") still count toward the right person.
  const byLower = {};
  staffNames.forEach(n=>{ byLower[n.trim().toLowerCase()] = n; });

  const seen = new Set();
  const counts = {};
  staffNames.forEach(n=> counts[n] = 0);
  if(!entriesRes.error){
    (entriesRes.data||[]).forEach(r=>{
      const raw = (r.staff_name||'').trim();
      if(!raw) return;
      const canonical = byLower[raw.toLowerCase()];
      if(!canonical) return; // not a current staff member — skip rather than show a ghost entry
      const key = canonical + '|' + r.entry_date;
      if(seen.has(key)) return;
      seen.add(key);
      counts[canonical] = (counts[canonical]||0) + 1;
    });
  }
  return staffNames.map(name=>({ name, peanuts: counts[name] })).sort((a,b)=> b.peanuts - a.peanuts);
}

const HISTORY_DAYS = 14;
const DAYS_OF_COVER = 7;
async function fetchItemHistory(itemId){
  const since = new Date(); since.setDate(since.getDate() - HISTORY_DAYS);
  const sinceISO = since.toISOString().slice(0,10);
  const { data, error } = await db.from('tt_entries').select('entry_date,usage')
    .eq('item_id', itemId).gte('entry_date', sinceISO).order('entry_date',{ascending:true});
  if(error){ console.error(error); return []; }
  return data || [];
}
function computeSuggestion(history){
  if(!history.length) return null;
  const totalUsage = history.reduce((s,e)=> s + Number(e.usage||0), 0);
  const avgDaily = totalUsage / history.length;
  return { avgDaily, suggestedQty: Math.ceil(avgDaily * DAYS_OF_COVER), daysLogged: history.length };
}

let dailyUsageCache = null;
async function fetchDailyUsageTotals(days){
  const since = new Date(); since.setDate(since.getDate() - (days - 1));
  const sinceISO = since.toISOString().slice(0,10);
  const { data, error } = await db.from('tt_entries').select('entry_date,usage').gte('entry_date', sinceISO);
  const map = {};
  if(!error && data){
    data.forEach(r=>{ map[r.entry_date] = (map[r.entry_date]||0) + Number(r.usage||0); });
  }
  const result = [];
  for(let i = days - 1; i >= 0; i--){
    const d = new Date(); d.setDate(d.getDate() - i);
    const iso = d.toISOString().slice(0,10);
    result.push({
      date: iso,
      total: map[iso] || 0,
      label: d.toLocaleDateString(undefined,{weekday:'short'}).slice(0,3).toUpperCase()
    });
  }
  dailyUsageCache = result;
  return result;
}

// ---- Status logic ----
function statusFor(item){
  const s = item.currentStock;
  if(s <= item.par) return 'reorder';
  if(item.lowAt && s <= item.lowAt) return 'low';
  if(item.maxAt && item.maxAt > 0 && s >= item.maxAt) return 'over';
  return 'ok';
}
const statusLabel = {ok:'OK', low:'Low', reorder:'Reorder', over:'Over-stocked'};

const EXPIRY_WARN_DAYS = 3;
function daysUntilExpiry(item){
  if(!item.expiryDate) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(item.expiryDate + 'T00:00:00');
  return Math.round((exp - today) / 86400000);
}
function isExpired(item){ const d = daysUntilExpiry(item); return d !== null && d < 0; }
function isExpiringSoon(item){ const d = daysUntilExpiry(item); return d !== null && d >= 0 && d <= EXPIRY_WARN_DAYS; }
function expiryLabel(item){
  const d = daysUntilExpiry(item);
  if(d === null) return '';
  if(d < 0) return `Expired ${Math.abs(d)}d ago`;
  if(d === 0) return 'Expires today';
  return `Expires in ${d}d`;
}

// ---- Overall stock health ----
function updateHealthBadge(){
  if(!healthLabelEl || !healthFillEl) return;
  if(!items.length){
    healthLabelEl.textContent = 'No items yet';
    healthLabelEl.className = 'stk-health-label';
    healthFillEl.className = 'stk-health-fill';
    healthFillEl.style.width = '0%';
    return;
  }
  const scoreFor = { reorder:0, low:0.5, over:0.85, ok:1 };
  const total = items.reduce((sum,i)=> sum + scoreFor[statusFor(i)], 0);
  const avg = total / items.length;
  const pct = Math.round(avg * 100);
  let tier, label;
  if(avg < 0.5){ tier='critical'; label='Needs attention'; }
  else if(avg < 0.8){ tier='ok'; label='Stock levels are good'; }
  else { tier='great'; label='Stock levels are excellent'; }
  healthLabelEl.textContent = label;
  healthLabelEl.className = 'stk-health-label ' + tier;
  healthFillEl.className = 'stk-health-fill ' + tier;
  healthFillEl.style.width = Math.max(pct,6) + '%';
}

function render(){
  updateHealthBadge();
  if(activeTab==='dashboard') renderDashboard();
  else if(activeTab==='entry') renderEntry();
  else if(activeTab==='roster') renderRoster();
  else if(activeTab==='cash') renderCashCount();
  else renderItems();
}

function renderItemCardsHtml(itemList, emptyMessage){
  if(!itemList.length) return `<div class="stk-empty">${emptyMessage}</div>`;
  return itemList.map(i=>{
    const st = statusFor(i);
    const scaleMax = Math.max(i.maxAt||0, i.par*2, i.currentStock, 1);
    const pct    = Math.min(100,(i.currentStock/scaleMax)*100);
    const parPct = Math.min(100,(i.par/scaleMax)*100);
    const expBadge = isExpired(i) ? `<div class="stk-status expired" style="margin-top:4px;">${esc(expiryLabel(i))}</div>`
                    : isExpiringSoon(i) ? `<div class="stk-status expiring" style="margin-top:4px;">${esc(expiryLabel(i))}</div>` : '';
    const starBadge = i.important ? `<span class="stk-card-star" title="Important">&#9733;</span>` : '';
    return `<div class="stk-card stk-card-clickable" data-id="${i.id}">
      <div class="stk-card-top">
        <div><div class="stk-item-name">${starBadge}${esc(i.name)}</div>
        <div class="stk-item-unit">reorder at ${i.par}${i.lowAt?' &middot; low at '+i.lowAt:''}${i.maxAt?' &middot; max '+i.maxAt:''} ${esc(i.unit)}</div></div>
        <div style="text-align:right;"><div class="stk-status ${st}">${statusLabel[st]}</div>${expBadge}</div>
      </div>
      <div class="stk-meter">
        <div class="stk-meter-fill ${st}" style="width:${pct}%"></div>
        <div class="stk-meter-par" style="left:${parPct}%"></div>
      </div>
      <div class="stk-nums"><span>on hand</span><b>${i.currentStock} ${esc(i.unit)}</b></div>
      ${st==='reorder'?`<div class="stk-order-line">&#8594; Order ${i.reorderQty} ${esc(i.unit)}</div>`:''}

function renderRoster(){
  const workingIds = new Set(staffWorking.map(s=>s.team_member_id));
  const todayStr = new Date().toDateString();
  const tomorrowStr = new Date(Date.now()+86400000).toDateString();

  const groups = {};
  rosterShifts.forEach(s=>{
    const key = new Date(s.start_at).toDateString();
    (groups[key] = groups[key] || []).push(s);
  });

  const days = [];
  for(let i=0;i<7;i++){
    const d = new Date(); d.setDate(d.getDate()+i);
    days.push({ dateObj:d, key:d.toDateString(), shifts: groups[d.toDateString()] || [] });
  }

  const dayPills = days.map(day=>{
    const label = day.key===todayStr ? 'Today' : day.dateObj.toLocaleDateString(undefined,{weekday:'short'});
    const anchor = `roster-day-${day.dateObj.getDate()}-${day.dateObj.getMonth()}`;
    return `<button class="stk-roster-daypill ${day.key===todayStr?'today':''}" data-anchor="${anchor}">${label}<span>${day.shifts.length||'&middot;'}</span></button>`;
  }).join('');

  const sections = days.map(day=>{
    const d = day.dateObj;
    const dayLabel = day.key===todayStr ? 'Today' : day.key===tomorrowStr ? 'Tomorrow' : d.toLocaleDateString(undefined,{weekday:'long'});
    const dateLabel = d.toLocaleDateString(undefined,{day:'numeric',month:'short'});
    const anchorId = `roster-day-${d.getDate()}-${d.getMonth()}`;
    const rows = day.shifts.length ? day.shifts.map(s=>{
      const start = new Date(s.start_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
      const end = s.end_at ? new Date(s.end_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}) : '';
      const isLive = workingIds.has(s.team_member_id);
      return `<div class="stk-roster-row">
        <div class="stk-roster-row-dot ${isLive?'live':''}"></div>
        <div class="stk-roster-row-main">
          <div class="stk-roster-row-name">${esc(s.name)}${isLive?' <span class="stk-live-badge">LIVE</span>':''}</div>
          <div class="stk-roster-row-time">${start}${end?' &ndash; '+end:''}</div>
        </div>
      </div>`;
    }).join('') : `<div class="stk-roster-empty">No one rostered</div>`;
    return `<div class="stk-roster-day ${day.key===todayStr?'today':''}" id="${anchorId}">
      <div class="stk-roster-day-title">
        <span class="stk-roster-day-name">${dayLabel}</span>
        <span class="stk-roster-day-date">${dateLabel}</span>
        ${day.shifts.length ? `<span class="stk-roster-headcount">${day.shifts.length} rostered</span>` : ''}
      </div>
      ${rows}
    </div>`;
  }).join('');

  const hoursByDay = days.map(day=>{
    const totalHours = day.shifts.reduce((sum,s)=>{
      if(!s.end_at) return sum;
      return sum + (new Date(s.end_at) - new Date(s.start_at))/3600000;
    },0);
    return { label: day.key===todayStr ? 'TODAY' : day.dateObj.toLocaleDateString(undefined,{weekday:'short'}).slice(0,3).toUpperCase(), total: Math.round(totalHours*10)/10 };
  });

  const hoursByStaff = {};
  rosterShifts.forEach(s=>{
    if(!s.end_at) return;
    const hrs = (new Date(s.end_at) - new Date(s.start_at))/3600000;
    hoursByStaff[s.name] = (hoursByStaff[s.name]||0) + hrs;
  });
  const staffChartData = Object.keys(hoursByStaff)
    .sort((a,b)=> hoursByStaff[b]-hoursByStaff[a])
    .map(name=>({ label:name.split(' ')[0].slice(0,8).toUpperCase(), total: Math.round(hoursByStaff[name]*10)/10 }));

  const patternCharts = `<div class="stk-bento-grid">
    <div class="stk-bento-cell">
      <div class="stk-panel">
        <div class="stk-chart-card-title">Hours Scheduled</div>
        <div class="stk-chart-card-sub">Per day, this week</div>
        ${renderUsageBarChart(hoursByDay)}
      </div>
    </div>
    <div class="stk-bento-cell">
      <div class="stk-panel">
        <div class="stk-chart-card-title">Workload Split</div>
        <div class="stk-chart-card-sub">Hours per staff member</div>
        ${staffChartData.length ? renderUsageBarChart(staffChartData) : '<div class="stk-empty">No shifts published yet.</div>'}
      </div>
    </div>
  </div>`;

  contentEl.innerHTML = `<div class="stk-panel">
    <div class="stk-chart-card-title" style="margin-bottom:var(--sp-3);">Next 7 days</div>
    <div class="stk-roster-daypills">${dayPills}</div>
    ${sections}
  </div>`;
  contentEl.innerHTML = patternCharts + contentEl.innerHTML;

  contentEl.querySelectorAll('.stk-roster-daypill[data-anchor]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const el = document.getElementById(btn.dataset.anchor);
      if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
    });
  });
}

function animateNumberRoll(el, finalValue, duration){
  if(!el) return;
  const finalStr = String(finalValue);
  const digitCount = finalStr.length;
  const start = performance.now();
  function frame(now){
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    if(progress >= 1){
      el.textContent = finalStr;
      return;
    }
    if(Math.random() < progress * progress){
      el.textContent = finalStr;
    } else {
      const randomVal = Math.floor(Math.random() * Math.pow(10, digitCount));
      el.textContent = String(randomVal);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function renderEntryForm(itemList, sectionTitle, backLabel, onBack, prefixHtml=''){
  const rows = itemList.map(i=>{
    const e = entriesToday[i.id]||{};
    const opening  = i.currentStock;
    const closing  = e.closing  ?? '';
    const usage    = closing!=='' && closing!==undefined ? Math.max(0, opening - Number(closing)) : null;
    const starBadge = i.important ? `<span class="stk-card-star" title="Important">&#9733;</span>` : '';
    return `<div class="stk-entry-row" data-id="${i.id}">
      <div class="stk-entry-name">${starBadge}${esc(i.name)}<span>opening: ${opening} ${esc(i.unit)}</span></div>
      <input class="stk-input stk-closing"  type="number" min="0" placeholder="quantity" value="${closing}">
      <div class="stk-usage">${usage===null?'&mdash;':usage+' used'}</div>
    </div>`;
  }).join('');

  const lastName = localStorage.getItem('tt_last_staff_name') || '';
  const voiceSupported = !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  contentEl.innerHTML = prefixHtml + (itemList.length ? `<button class="stk-back" id="stkBack">&#8592; ${backLabel}</button>
  <div class="stk-panel">
    <div style="font-weight:500;margin-bottom:4px;">${esc(sectionTitle)} &mdash; ${itemList.length} item${itemList.length!==1?'s':''}</div>
    <div class="stk-voice">
      ${voiceSupported
        ? `<button class="stk-mic-btn" id="stkMicBtn">${micIconSvg()} Speak your count</button>
           <div class="stk-voice-transcript" id="stkVoiceTranscript"></div>`
        : `<div class="stk-voice-unsupported">${micIconSvg()} Voice input isn't supported in this browser &mdash; try Chrome, Edge, or Android.</div>`}
    </div>
    <div class="stk-entry-row head three-col"><div>Item</div><div>Quantity Available</div><div>Usage today</div></div>
    ${rows}
    <div class="stk-signoff">
      <label>Signed off by</label>
      ${staffList.length ? `<div class="stk-staff-picker" id="stkStaffPicker">
        ${staffList.map(s=>`<button type="button" class="stk-staff-chip ${s.name===selectedStaffName?'active':''}" data-name="${escAttr(s.name)}">${esc(s.name)}</button>`).join('')}
      </div>` : `<input class="stk-input" id="stkStaffName" placeholder="Your name" value="${escAttr(lastName)}"><div class="hint">Add your team under Items &amp; thresholds &rarr; Staff to switch to a tap-to-pick list.</div>`}
    </div>
    <div class="stk-actions"><button class="stk-btn" id="stkSaveEntry">Save ${esc(sectionTitle.toLowerCase())} count</button></div>
  </div>`
  : `<button class="stk-back" id="stkBack">&#8592; ${backLabel}</button>
  <div class="stk-panel"><div class="stk-empty">No items here yet.</div></div>`);

  contentEl.querySelectorAll('.stk-entry-row[data-id]').forEach(row=>{
    const id       = row.dataset.id;
    const clsInput = row.querySelector('.stk-closing');
    const usageEl  = row.querySelector('.stk-usage');
    const item     = items.find(x=>x.id===id);
    function recalc(){
      const c2 = clsInput.value;
      usageEl.innerHTML = c2!=='' ? (Math.max(0,item.currentStock-Number(c2)))+' used' : '&mdash;';
    }
    clsInput.addEventListener('input',recalc);
  });

  document.getElementById('stkBack').addEventListener('click', onBack);
  const saveBtn = document.getElementById('stkSaveEntry');
  if(saveBtn) saveBtn.addEventListener('click', onSaveEntry);
  if(voiceSupported && itemList.length) initVoiceCount(itemList);
  contentEl.querySelectorAll('.stk-staff-chip[data-name]').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      selectedStaffName = chip.dataset.name;
      contentEl.querySelectorAll('.stk-staff-chip').forEach(c=> c.classList.toggle('active', c===chip));
    });
  });
}

async function onSaveEntry(){
  const nameInput = document.getElementById('stkStaffName');
  const staffName = staffList.length ? (selectedStaffName || '').trim() : (nameInput ? nameInput.value.trim() : '');
  if(!staffName){ toast(staffList.length ? 'Tap your name to sign off on this count' : 'Enter your name to sign off on this count'); return; }

  const btn = document.getElementById('stkSaveEntry');
  btn.disabled=true; btn.textContent='Saving...';
  const date = todayISO();
  let touched=0, ok=true;

  for(const row of contentEl.querySelectorAll('.stk-entry-row[data-id]')){
    const id    = row.dataset.id;
    const close = row.querySelector('.stk-closing').value;
    if(close==='') continue;
    touched++;
    const item        = items.find(x=>x.id===id);
    const closingNum  = Number(close);
    const entry = { opening:item.currentStock, received:0, closing:closingNum, usage:Math.max(0,item.currentStock-closingNum), staff_name:staffName };
    const saved = await saveEntry(id, date, entry);
    if(!saved){ ok=false; continue; }
    entriesToday[id] = entry;
    item.currentStock = closingNum;
    await saveItem(item);
  }

  btn.disabled=false; btn.textContent="Save count";
  if(touched===0){ toast('Enter at least one closing count first'); return; }
  if(ok){
    localStorage.setItem('tt_last_staff_name', staffName);
    lastEntryMeta = { staff_name: staffName, created_at: new Date().toISOString() };
    refreshMetaLine();
    toast('Saved \u2014 signed off by ' + staffName);
    const peanutKey = 'tt_peanut_' + staffName.toLowerCase().trim() + '_' + date;
    if(!localStorage.getItem(peanutKey)){
      localStorage.setItem(peanutKey, '1');
      setTimeout(()=> celebratePeanut(staffName.split(' ')[0]), 900);
    }
    staffPeanuts = await loadStaffPeanuts();
    entrySearchQuery = '';
    if(entryMain === 'important'){ entryMain = null; } else { entryCategory = null; }
    render();
  }
}

// ---- Voice count ----
let recognitionActive = false;
function initVoiceCount(catItems){
  const micBtn = document.getElementById('stkMicBtn');
  const transcriptEl = document.getElementById('stkVoiceTranscript');
  if(!micBtn) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const recognition = new SR();
  recognition.lang = 'en-AU';
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.maxAlternatives = 1;

  let finalTranscript = '';

  micBtn.addEventListener('click', ()=>{
    if(recognitionActive){ recognition.stop(); return; }
    finalTranscript = '';
    transcriptEl.textContent = '';
    transcriptEl.classList.remove('show');
    try{ recognition.start(); }
    catch(e){ toast('Could not start microphone'); }
  });

  recognition.onstart = ()=>{
    recognitionActive = true;
    micBtn.classList.add('listening');
    micBtn.innerHTML = `${micIconSvg()} Listening... tap to stop`;
  };
  recognition.onresult = (e)=>{
    let interim = '';
    for(let i=e.resultIndex; i<e.results.length; i++){
      const chunk = e.results[i][0].transcript;
      if(e.results[i].isFinal) finalTranscript += chunk + ' ';
      else interim += chunk;
    }
    transcriptEl.textContent = (finalTranscript + interim).trim();
    transcriptEl.classList.add('show');
  };
  recognition.onerror = (e)=>{
    if(e.error === 'not-allowed' || e.error === 'permission-denied'){
      toast('Microphone access was blocked \u2014 check your browser settings');
    } else if(e.error !== 'no-speech' && e.error !== 'aborted'){
      toast('Voice input error \u2014 try again');
    }
  };
  recognition.onend = ()=>{
    recognitionActive = false;
    micBtn.classList.remove('listening');
    micBtn.innerHTML = `${micIconSvg()} Speak your count`;
    const spoken = finalTranscript.trim();
    if(spoken) parseVoiceTranscript(spoken, catItems, transcriptEl);
  };
}

const NUMBER_WORDS = {
  zero:0, none:0, nil:0, oh:0,
  one:1, two:2, three:3, four:4, for:4, five:5, six:6, seven:7, eight:8, ate:8, nine:9, ten:10,
  eleven:11, twelve:12, thirteen:13, fourteen:14, fifteen:15, sixteen:16, seventeen:17, eighteen:18, nineteen:19, twenty:20,
  thirty:30, forty:40, fifty:50
};
function wordsToNumber(str){
  const digitMatch = str.match(/\d+(\.\d+)?/);
  if(digitMatch) return parseFloat(digitMatch[0]);
  const words = str.toLowerCase().split(/\s+/);
  for(const w of words){
    const clean = w.replace(/[^a-z]/g,'');
    if(clean in NUMBER_WORDS) return NUMBER_WORDS[clean];
  }
  return null;
}
function normalizeName(s){
  return s.toLowerCase().replace(/\([^)]*\)/g,'').replace(/[^a-z0-9\s]/g,'').trim();
}
function matchTranscriptLocally(transcript, catItems){
  const segments = transcript.split(/,|\.|;|\band\b/i).map(s=>s.trim()).filter(Boolean);
  const results = [];
  const usedIds = new Set();
  segments.forEach(seg=>{
    const segLower = seg.toLowerCase();
    let best = null, bestScore = 0;
    catItems.forEach(item=>{
      const norm = normalizeName(item.name);
      const nameWords = norm.split(/\s+/).filter(w=>w.length>2);
      if(!nameWords.length) return;
      let score = 0;
      if(segLower.includes(norm)) score = norm.length + 10;
      else nameWords.forEach(w=>{ if(segLower.includes(w)) score += w.length; });
      if(score > bestScore){ bestScore = score; best = item; }
    });
    if(best && bestScore >= 3 && !usedIds.has(best.id)){
      const qty = wordsToNumber(seg);
      if(qty !== null){
        results.push({itemId: best.id, quantity: qty});
        usedIds.add(best.id);
      }
    }
  });
  return results;
}

function parseVoiceTranscript(transcript, catItems, transcriptEl){
  transcriptEl.textContent = 'Matching to your items...';
  const matches = matchTranscriptLocally(transcript, catItems);
  applyVoiceMatches(matches, transcriptEl);
}

function applyVoiceMatches(matches, transcriptEl){
  if(!Array.isArray(matches) || !matches.length){
    transcriptEl.textContent = "Didn't catch any items \u2014 try again or enter manually.";
    return;
  }
  let filled = 0;
  matches.forEach(m=>{
    const row = contentEl.querySelector(`.stk-entry-row[data-id="${m.itemId}"]`);
    if(!row) return;
    const closingInput = row.querySelector('.stk-closing');
    if(!closingInput) return;
    closingInput.value = m.quantity;
    closingInput.dispatchEvent(new Event('input'));
    row.classList.add('stk-row-highlight');
    setTimeout(()=> row.classList.remove('stk-row-highlight'), 2000);
    filled++;
  });
  transcriptEl.textContent = filled
    ? `Filled ${filled} item${filled>1?'s':''} from voice \u2014 check the counts below and save when ready.`
    : "Didn't recognize any of those items \u2014 try again or enter manually.";
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);

async function enablePushNotifications(){
  if(!('serviceWorker' in navigator) || !('PushManager' in window)){
    toast('Notifications aren\u2019t supported on this device/browser');
    return;
  }
  try{
    const permission = await Notification.requestPermission();
    if(permission !== 'granted'){ toast('Notifications were not allowed'); return; }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const subJson = sub.toJSON();
    const { error } = await db.from('tt_push_subscriptions').upsert({
      endpoint: subJson.endpoint,
      p256dh: subJson.keys.p256dh,
      auth: subJson.keys.auth,
      staff_name: localStorage.getItem('tt_last_staff_name') || null
    }, { onConflict: 'endpoint' });
    if(error){ console.error(error); toast('Could not save notification settings'); return; }
    updateNotifyButton('on');
    toast('Notifications enabled on this device');
  }catch(e){
    console.error(e);
    toast('Could not enable notifications');
  }
}

async function init(){
  const splashStart = Date.now();
  await loadSubcategoryMap();
  await loadItems();
  entriesToday = await loadEntries(todayISO());
  await loadLastEntryMeta();
  noteEl.innerHTML = '&#128274; Data syncs in real time across all devices via Supabase &mdash; any staff member\'s entry updates everyone instantly.';
  subscribeRealtime();
  render();
  const minDisplay = 1300;
  const elapsed = Date.now() - splashStart;
  setTimeout(hideSplash, Math.max(0, minDisplay - elapsed));
  staffWorking = await loadStaffWorking();
  renderStaffWorking();
  rosterShifts = await loadRoster();
  weeklyUsage = await fetchDailyUsageTotals(6);
  staffPeanuts = await loadStaffPeanuts();
  staffList = await loadStaffList();
  cashCounts = await loadCashCounts();
  announcements = await loadAnnouncements();
  render();
  initPushNotifications();
}
function hideSplash(){
  const el = document.getElementById('stkSplash');
  if(!el) return;
  el.classList.add('hide');
  setTimeout(()=> el.remove(), 600);
}
let currentStaffRole = null;
let currentStaffName = null;
let enteredPin = '';

function updatePinDots(){
  const dots = document.querySelectorAll('#stkPinDots span');
  dots.forEach((d,i)=> d.classList.toggle('filled', i < enteredPin.length));
}
function showPinError(msg){
  const el = document.getElementById('stkPinError');
  if(el) el.textContent = msg;
  const lock = document.getElementById('stkPinLock');
  if(lock){ lock.classList.add('shake'); setTimeout(()=> lock.classList.remove('shake'), 400); }
  enteredPin = '';
  updatePinDots();
}
async function submitPin(){
  const errEl = document.getElementById('stkPinError');
  if(errEl) errEl.textContent = '';
  try{
    const res = await fetch(`${SUPABASE_URL}/functions/v1/verify-staff-pin`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'Authorization':`Bearer ${SUPABASE_KEY}` },
      body: JSON.stringify({ pin: enteredPin })
    });
    const data = await res.json();
    if(!data.ok){ showPinError(data.error || 'Incorrect PIN'); return; }
    currentStaffName = data.name;
    currentStaffRole = data.role;
    localStorage.setItem('tt_last_staff_name', data.name);
    const lock = document.getElementById('stkPinLock');
    if(lock) lock.remove();
    init();
  }catch(e){
    console.error(e);
    showPinError('Could not check PIN \u2014 check your connection');
  }
}
function bindPinKeypad(){
  document.querySelectorAll('.stk-pin-key[data-num]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(enteredPin.length >= 4) return;
      enteredPin += btn.dataset.num;
      updatePinDots();
      if(enteredPin.length === 4) submitPin();
    });
  });
  const backBtn = document.querySelector('.stk-pin-key[data-action="back"]');
  if(backBtn) backBtn.addEventListener('click', ()=>{
    enteredPin = enteredPin.slice(0,-1);
    updatePinDots();
  });
}
async function checkPinLockNeeded(){
  try{
    const { count, error } = await db.from('tt_staff').select('*', { count:'exact', head:true }).not('pin','is',null);
    if(error || !count){ init(); return; } // no PINs configured yet — don't lock anyone out
    const lockHtml = `<div class="stk-pin-lock" id="stkPinLock">
      <div class="stk-pin-lock-logo">TT</div>
      <div class="stk-pin-lock-title">Enter your PIN</div>
      <div class="stk-pin-dots" id="stkPinDots"><span></span><span></span><span></span><span></span></div>
      <div class="stk-pin-error" id="stkPinError"></div>
      <div class="stk-pin-keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="stk-pin-key" data-num="${n}">${n}</button>`).join('')}
        <div></div><button class="stk-pin-key" data-num="0">0</button><button class="stk-pin-key" data-action="back">&#9003;</button>
      </div>
    </div>`;
    document.body.insertAdjacentHTML('beforeend', lockHtml);
    const splash = document.getElementById('stkSplash');
    if(splash) splash.remove();
    bindPinKeypad();
  }catch(e){ console.error(e); init(); }
}
checkPinLockNeeded();

const hudEl = document.querySelector('.stk-hud');
if(hudEl){
  let ticking = false;
  window.addEventListener('scroll', ()=>{
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(()=>{
      hudEl.classList.toggle('compact', window.scrollY > 40);
      ticking = false;
    });
  }, {passive:true});
}
